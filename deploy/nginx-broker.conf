# Include inside the HTTPS server block that serves BROKER_PUBLIC_ORIGIN.
# Proxies /broker/ (Twilio webhooks and media WebSockets) to the broker on loopback.
location ^~ /broker/ {
    proxy_pass http://127.0.0.1:3213;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 64k;
    proxy_read_timeout 14500s;
    proxy_send_timeout 60s;
}
